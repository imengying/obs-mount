name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A tag push and a branch push would otherwise queue two identical builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep clippy honest without turning style drift into red builds.
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting, lint, tests, and the release build everyone
  # actually deploys (dynamically linked glibc, matching `cargo build --release`).
  check:
    name: fmt / clippy / test / build (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins channel + components, so this just needs to
      # install whatever it says.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: cargo build --release
        run: cargo build --release

      - name: Binary sanity check
        run: |
          set -eux
          ./target/release/obs-mount --version
          ./target/release/obs-mount --help > /dev/null
          # Mounting is impossible on a CI runner; make sure the failure is a
          # clear configuration error, not a crash or a panic.
          ./target/release/obs-mount 2>&1 | grep -qi "not set" || {
            echo "expected a missing-configuration error"; exit 1; }

      # GitHub's ubuntu runners expose /dev/fuse and allow unprivileged FUSE
      # mounts, so the mock-server end-to-end test can run here. It skips
      # itself when /dev/fuse is missing.
      - name: End-to-end test against mock OBS
        run: |
          sudo apt-get update
          # fuse3 provides fusermount; attr provides setfattr/getfattr so the
          # xattr assertions actually run instead of silently skipping.
          sudo apt-get install -y --no-install-recommends fuse3 attr
          OBS_E2E_REQUIRE_XATTR=1 ./tests/e2e.sh

      - name: Upload glibc binary
        uses: actions/upload-artifact@v7
        with:
          name: obs-mount-x86_64-linux-gnu
          path: target/release/obs-mount
          if-no-files-found: error

  # Fully static binary. Debian 13 (trixie) already ships musl-tools, so the
  # zig cross-compiler dance the README used to describe is unnecessary: the
  # only C dependency in the tree is aws-lc-sys (via rustls), and musl-gcc is
  # enough for it. Proven locally on trixie with musl-tools 1.2.5.
  static:
    name: static build (musl)
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            build-essential \
            cmake \
            musl-tools \
            perl \
            pkg-config \
            git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - name: Install Rust (musl target)
        run: |
          set -eux
          # rust-toolchain.toml supplies channel + components; only the target
          # has to be added here.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: musl

      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify it is really static
        run: |
          set -eux
          bin=target/x86_64-unknown-linux-musl/release/obs-mount
          file "$bin"
          ldd "$bin" 2>&1 | grep -q "statically linked"
          "$bin" --version

      - name: Upload static binary
        uses: actions/upload-artifact@v7
        with:
          name: obs-mount-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/obs-mount
          if-no-files-found: error

  # Publishing happens only for an annotated v* tag, and only if the tag
  # matches the version in Cargo.toml -- otherwise the release would carry
  # binaries whose `--version` disagrees with the tag name.
  release:
    name: publish release
    needs: [check, static]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match Cargo.toml version
        run: |
          set -eux
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag crate=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $ver"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect binaries and checksums
        run: |
          set -eux
          mkdir -p dist
          install -m 0755 artifacts/obs-mount-x86_64-linux-gnu/obs-mount \
            dist/obs-mount-x86_64-linux-gnu
          install -m 0755 artifacts/obs-mount-x86_64-linux-musl/obs-mount \
            dist/obs-mount-x86_64-linux-musl
          cd dist
          sha256sum obs-mount-x86_64-linux-gnu obs-mount-x86_64-linux-musl \
            > SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/obs-mount-x86_64-linux-gnu
            dist/obs-mount-x86_64-linux-musl
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
