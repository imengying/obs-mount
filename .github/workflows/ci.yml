name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A tag push and a branch push would otherwise queue two identical builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep clippy honest without turning style drift into red builds.
  RUSTFLAGS: -D warnings

jobs:
  # Build and exercise each glibc binary on its own CPU architecture.
  build:
    name: build & test (${{ matrix.arch }}, glibc)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            machine: Advanced Micro Devices X86-64
            interpreter: /lib64/ld-linux-x86-64.so.2
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            machine: AArch64
            interpreter: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      ARCHIVE: obs-mount-${{ matrix.arch }}-linux-gnu.tar.gz
      ELF_MACHINE: ${{ matrix.machine }}
      ELF_INTERPRETER: ${{ matrix.interpreter }}
      OBS_MOUNT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/obs-mount
    steps:
      - name: Require FUSE device
        run: |
          if [ ! -c /dev/fuse ] || [ ! -r /dev/fuse ] || [ ! -w /dev/fuse ]; then
            echo "::error::FUSE mount tests require a readable and writable /dev/fuse"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          # fuse3: the ignored Rust test mounts a real FUSE filesystem.
          # jq locates the compiled test harness; only that harness runs as root.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake perl pkg-config file binutils fuse3 jq ca-certificates

      - uses: actions/checkout@v7

      - name: Install Rust (GNU target)
        run: |
          set -eux
          # The hosted runner already supplies rustup. Match rust-toolchain.toml.
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add "$BUILD_TARGET"

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.runner }}-${{ matrix.target }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: Build glibc binary
        env:
          # A tag build stamps its version into the binary so `--version`
          # matches the release name; branch builds fall back to Cargo.toml.
          OBS_MOUNT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: cargo build --release --target "$BUILD_TARGET"

      - name: Verify the binary
        run: |
          set -eux
          bin="$OBS_MOUNT_BIN"
          file "$bin"
          readelf -hW "$bin" | grep -F "Machine:" | grep -F "$ELF_MACHINE"
          # Require the architecture's glibc loader and a dynamic libc dependency.
          readelf -lW "$bin" > program-headers.txt
          readelf -dW "$bin" > dynamic-section.txt
          grep -F "[Requesting program interpreter: $ELF_INTERPRETER]" program-headers.txt
          grep -F '(NEEDED)' dynamic-section.txt | grep -F '[libc.so.6]'
          ldd "$bin" > shared-libraries.txt
          cat shared-libraries.txt
          if grep -q 'not found' shared-libraries.txt; then
            echo "binary has unresolved shared library dependencies"
            exit 1
          fi
          # Keep the Ubuntu 24.04 runtime baseline even as Rust/dependencies evolve.
          readelf --version-info -W "$bin" > version-info.txt
          glibc_max=$(grep -oE 'Name: GLIBC_[0-9]+(\.[0-9]+)+' version-info.txt \
            | cut -d_ -f2 | sort -Vu | tail -n 1)
          test -n "$glibc_max"
          echo "Highest referenced glibc version: $glibc_max (maximum: 2.39)"
          if [ "$(printf '%s\n' "$glibc_max" 2.39 | sort -V | tail -n 1)" != 2.39 ]; then
            echo "::error::binary exceeds the Ubuntu 24.04 glibc 2.39 baseline"
            exit 1
          fi
          "$bin" --version
          "$bin" --help > /dev/null
          # A missing configuration must be a clear error, not a panic.
          if output=$("$bin" 2>&1); then
            echo "expected a missing-configuration error"
            exit 1
          fi
          printf '%s\n' "$output" | grep -qi "not set"

      - name: CLI test against mock OBS
        run: |
          cargo test tests::rejects_file_bucket_before_mounting -- --exact --ignored

      - name: Required FUSE mount test
        timeout-minutes: 5
        run: |
          # Preserve root + cross-user mount coverage without compiling as root.
          test_bin=$(cargo test --no-run --message-format=json | jq -r \
            'select(.reason == "compiler-artifact" and .profile.test and .target.name == "obs-mount") | .executable // empty')
          test -x "$test_bin"
          "$test_bin" fs::tests::mounted::round_trip --exact --ignored --list \
            | grep -Fx 'fs::tests::mounted::round_trip: test'
          sudo env OBS_MOUNT_BIN="$OBS_MOUNT_BIN" \
            "$test_bin" fs::tests::mounted::round_trip --exact --ignored --nocapture

      # Everything needed at the archive root: the binary, so ExecStart= needs
      # no rename, and a config template, so there is no separate download.
      - name: Package as tar.gz
        run: |
          set -eux
          mkdir -p pkg
          install -m 0755 "$OBS_MOUNT_BIN" pkg/obs
          install -m 0644 obs-mount.yaml.example pkg/obs-mount.yaml.example
          tar -C pkg -czf "$ARCHIVE" obs obs-mount.yaml.example
          tar -tzvf "$ARCHIVE"
          # Execute the extracted archive on the matching native runner.
          mkdir -p unpacked
          tar -xzf "$ARCHIVE" -C unpacked
          test -x unpacked/obs
          test -f unpacked/obs-mount.yaml.example
          ./unpacked/obs --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$(./unpacked/obs --version)" = "obs-mount ${GITHUB_REF_NAME#v}"
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: obs-mount-${{ matrix.arch }}-linux-gnu
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Publishing happens only for a v* tag. The binary was stamped with that tag
  # name during the build, so `--version` always matches the release.
  release:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect both architecture tarballs
        run: |
          set -eux
          mkdir -p dist
          # Each archive was already executed on its own native build runner.
          for arch in x86_64 aarch64; do
            archive="obs-mount-$arch-linux-gnu.tar.gz"
            test -s "artifacts/$archive"
            cp "artifacts/$archive" dist/
          done
          ls -l dist

      # GitHub attaches checksums for release assets itself, so no
      # hand-rolled SHA256SUMS file is published here.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/obs-mount-x86_64-linux-gnu.tar.gz
            dist/obs-mount-aarch64-linux-gnu.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
