name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A tag push and a branch push would otherwise queue two identical builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep clippy honest without turning style drift into red builds.
  RUSTFLAGS: -D warnings

jobs:
  # One build, one artifact: a fully static musl binary built on Ubuntu 24.04.
  # Nothing links against the host's glibc, so there is no glibc version to
  # track and the result runs on any x86_64 Linux.
  build:
    name: build & test (Ubuntu 24.04, static)
    runs-on: ubuntu-24.04
    steps:
      - name: Require FUSE device
        run: |
          if [ ! -c /dev/fuse ] || [ ! -r /dev/fuse ] || [ ! -w /dev/fuse ]; then
            echo "::error::FUSE mount tests require a readable and writable /dev/fuse"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          # fuse3: the ignored Rust test mounts a real FUSE filesystem.
          # jq locates the compiled test harness; only that harness runs as root.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake musl-tools perl pkg-config file binutils fuse3 jq

      - uses: actions/checkout@v7

      - name: Install Rust (musl target)
        run: |
          set -eux
          # The hosted runner already supplies rustup. Match rust-toolchain.toml.
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ubuntu-24.04-musl

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          # A tag build stamps its version into the binary so `--version`
          # matches the release name; branch builds fall back to Cargo.toml.
          OBS_MOUNT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify the binary
        run: |
          set -eux
          bin=target/x86_64-unknown-linux-musl/release/obs-mount
          file "$bin"
          # Inspect ELF headers instead of relying on distro-specific ldd output.
          readelf -lW "$bin" > program-headers.txt
          readelf -dW "$bin" > dynamic-section.txt
          if grep -q INTERP program-headers.txt || grep -q NEEDED dynamic-section.txt; then
            echo "binary requires a dynamic loader or shared libraries"
            exit 1
          fi
          "$bin" --version
          "$bin" --help > /dev/null
          # A missing configuration must be a clear error, not a panic.
          if output=$("$bin" 2>&1); then
            echo "expected a missing-configuration error"
            exit 1
          fi
          printf '%s\n' "$output" | grep -qi "not set"

      - name: CLI test against mock OBS
        env:
          OBS_MOUNT_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/obs-mount
        run: |
          cargo test tests::rejects_file_bucket_before_mounting -- --exact --ignored

      - name: Required FUSE mount test
        timeout-minutes: 5
        env:
          OBS_MOUNT_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/obs-mount
        run: |
          # Preserve root + cross-user mount coverage without compiling as root.
          test_bin=$(cargo test --no-run --message-format=json | jq -r \
            'select(.reason == "compiler-artifact" and .profile.test and .target.name == "obs-mount") | .executable // empty')
          test -x "$test_bin"
          "$test_bin" fs::tests::mounted::round_trip --exact --ignored --list \
            | grep -Fx 'fs::tests::mounted::round_trip: test'
          sudo env OBS_MOUNT_BIN="$OBS_MOUNT_BIN" \
            "$test_bin" fs::tests::mounted::round_trip --exact --ignored --nocapture

      # Everything needed at the archive root: the binary, so ExecStart= needs
      # no rename, and a config template, so there is no separate download.
      - name: Package as tar.gz
        run: |
          set -eux
          mkdir -p pkg
          install -m 0755 target/x86_64-unknown-linux-musl/release/obs-mount pkg/obs
          install -m 0644 obs-mount.yaml.example pkg/obs-mount.yaml.example
          tar -C pkg -czf obs-mount-x86_64-linux-musl.tar.gz obs obs-mount.yaml.example
          tar -tzvf obs-mount-x86_64-linux-musl.tar.gz

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: obs-mount-x86_64-linux-musl
          path: obs-mount-x86_64-linux-musl.tar.gz
          if-no-files-found: error

  # Publishing happens only for a v* tag. The binary was stamped with that tag
  # name during the build, so `--version` always matches the release.
  release:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect tarball
        run: |
          set -eux
          mkdir -p dist
          cp artifacts/obs-mount-x86_64-linux-musl.tar.gz dist/
          # Prove the archive unpacks to a runnable `obs` before publishing it.
          tar -xzf dist/obs-mount-x86_64-linux-musl.tar.gz -C dist
          test -x dist/obs
          ./dist/obs --version
          test -f dist/obs-mount.yaml.example
          rm dist/obs dist/obs-mount.yaml.example
          ls -l dist

      # GitHub attaches checksums for release assets itself, so no
      # hand-rolled SHA256SUMS file is published here.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/obs-mount-x86_64-linux-musl.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
