[package]
name = "obs-mount"
version = "0.1.0"
edition = "2024"
description = "Mount a Huawei Cloud OBS bucket as a local directory via FUSE, using OBS native REST signing (HMAC-SHA1, x-obs-*), not S3 compatibility."
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23"
libc = "0.2"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
fuser = "0.18"
hmac = "0.13"
md-5 = "0.11"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
serde_yaml = "0.9.34"
